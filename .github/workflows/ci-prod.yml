name: "Build & publish - PROD"
on:
  release:
    types: [released]

jobs:
  run-tests:
    name: "Run tests job"
    uses: ./.github/workflows/_tests.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    needs: [run-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - uses: pdm-project/setup-pdm@v3
        name: Setup PDM
        with:
          python-version: 3.12
          architecture: x64
          enable-pep582: true
          cache: false
      - name: Publish distribution 📦 to PyPI
        run: pdm publish --repository pypi --username __token__ --password ${{ secrets.PYPI_API_TOKEN }} --verbose

  docs:
    name: Start the build of docs 📚
    needs: [build-n-publish]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run docs.yml --ref main -f release="$GITHUB_REF_NAME" -f ref="$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
