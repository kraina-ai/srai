name: "Build & deploy docs"
on:
  # Started by "Test - DEV" and "Build & publish - PROD". Not a part of the latter: a release runs on
  # a tag, which the github-pages environment does not accept.
  workflow_dispatch:
    inputs:
      release:
        description: "Release to publish the docs as (e.g. 1.2.3), the dev version if empty"
        type: string
      ref:
        description: "Branch or tag to build the docs from, the selected branch if empty"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release }}

permissions:
  contents: read

jobs:
  build:
    name: Generate library 📚 documentation 📄
    runs-on: ubuntu-latest
    env:
      MKDOCS_EXECUTE_JUPYTER: false # execution is done before rendering documentation
      MKDOCS_DEV: ${{ inputs.release == '' }}
      FORCE_TERMINAL_MODE: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CICD_PAT_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install image libraries
        run: sudo apt-get install libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev pngquant
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dev-${{ hashFiles('**/pdm.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-dev-
      - name: Install pdm
        run: pip install pdm uv
      - name: Regenerate lock with environment markers
        run: pdm lock --update-reuse --strategy inherit_metadata
      - name: Generate requirements.txt
        run: pdm export --no-default -G all -dG docs -dG visualization -f requirements -o requirements.txt
      - name: Install dependencies
        run: uv pip install --no-deps -r requirements.txt --system
      - name: Install nbconvert dependency
        run: uv pip install jupyter nbconvert nbformat black --system
      - name: Install srai
        run: |
          pdm build -v -d dist
          uv pip install 'srai[all] @ file://'"$(pwd)/$(find dist -name '*.whl')" --system
      - name: Configure Git user
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: Cache Overpass data
        uses: actions/cache@v5
        with:
          path: "**/cache"
          key: mkdocs-overpass-dev-cache-${{ runner.os }}
      - name: Execute jupyter notebooks
        run: |
          jupyter nbconvert --to notebook --inplace --execute $(find examples/ -type f -name "*.ipynb" -not -path "examples/benchmark/*") --ExecutePreprocessor.kernel_name='python3'
      - uses: jannekem/run-python-script-action@v1
        name: Replace copyright date
        with:
          script: |
            import time
            file_name = "mkdocs.yml"
            with open(file_name) as f:
                data = f.read().replace('{current_year}', time.strftime("%Y"))
            with open(file_name, "w") as f:
                f.write(data)
      - name: Create remote for srai-docs repository
        run: git remote add origin-srai-docs https://github.com/kraina-ai/srai-docs
      - name: Fetch gh-pages branch
        run: git fetch origin-srai-docs gh-pages --depth=1
      - name: Publish documentation
        run: |
          if [ -z "$RELEASE" ]; then
            mike deploy --remote origin-srai-docs --push dev
          else
            mike deploy --remote origin-srai-docs --push --update-aliases "${RELEASE%.*}" latest
          fi
        env:
          RELEASE: ${{ inputs.release }}

  deploy:
    name: "Deploy docs job"
    needs: [build]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/redeploy_docs.yml
    secrets:
      CICD_PAT_TOKEN: ${{ secrets.CICD_PAT_TOKEN }}
