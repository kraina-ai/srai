[tox]
envlist =
    python3.10
    python3.11
    python3.12
    python3.13
isolated_build = True
skip_missing_interpreters = True

[testenv]
groups =
    all
    test
    lint
deps =
    coverage
    pre-commit
passenv = *
commands =
    coverage run --source=srai -m pytest -v -s --durations=20 tests
    coverage xml -o coverage.{envname}.xml
    coverage report -m
skip_install = true
